<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
// 页面挂在飞牛网关的 /app/<appname>/ 下时，接口/资源都要带着这个前缀。
// 少一个尾斜杠会让相对路径解析错位，这里把地址补正。
// 用 replaceState 而不是 location.replace：后者是整页重载，又发生在 head 解析期，
// 会让容器重新决定一次视口。
(function () {
  var p = location.pathname;
  var lastSeg = p.slice(p.lastIndexOf("/") + 1);
  // 只在「目录形式但少了尾斜杠」时补正，别把 xxx/index.html 也改成 xxx/index.html/
  if (p.indexOf("/app/") === 0 && p.charAt(p.length - 1) !== "/" && lastSeg.indexOf(".") === -1) {
    history.replaceState(null, "", p + "/" + location.search + location.hash);
  }
})();
function apiBase() {
  var m = location.pathname.match(/^\/app\/[^\/]+/);
  return m ? m[0] : "";
}
function withBase(path) {
  if (!path || path.charAt(0) !== "/") return path;
  return apiBase() + path;
}
</script>

<script>
// ?diag=1 时把视口相关实测数字贴在页面顶部，方便真机截图定位；不带参数永远不显示。
(function () {
  if (!/[?&]diag=1(&|$)/.test(location.search)) return;
  function render() {
    var old = document.getElementById("__maaDiag");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var vv = window.visualViewport;
    var shell = document.querySelector(".windowShell");
    var navs = document.querySelectorAll(".mainNav .navButton");
    var lastTab = navs.length ? navs[navs.length - 1].getBoundingClientRect() : null;
    var rows = [
      ["地址", location.pathname + location.search],
      ["innerWidth x innerHeight", window.innerWidth + " x " + window.innerHeight],
      ["documentElement.clientWidth", document.documentElement.clientWidth],
      ["body.clientWidth", document.body ? document.body.clientWidth : "-"],
      ["screen.width / availWidth", window.screen.width + " / " + window.screen.availWidth],
      ["devicePixelRatio", window.devicePixelRatio],
      ["visualViewport w / h / scale", vv ? vv.width + " / " + vv.height + " / " + vv.scale : "-"],
      ["outerWidth", window.outerWidth],
      ["matchMedia(max-width:1000px)", window.matchMedia("(max-width:1000px)").matches],
      ["documentElement.scrollWidth", document.documentElement.scrollWidth],
      ["shell 实际宽", shell ? Math.round(shell.getBoundingClientRect().width) : "-"],
      ["tab 个数 / 最后一个 tab 右边界", navs.length + " / " + (lastTab ? Math.round(lastTab.right) : "-")],
      ["UA", navigator.userAgent]
    ];
    var box = document.createElement("pre");
    box.id = "__maaDiag";
    box.style.cssText =
      "position:fixed;left:0;top:0;z-index:2147483647;margin:0;padding:8px 10px;" +
      "background:#000;color:#0f0;font:11px/1.55 Consolas,monospace;" +
      "white-space:pre-wrap;word-break:break-all;border-bottom:2px solid #0f0";
    box.style.width = Math.min(window.screen.width || 1e9, window.innerWidth || 1e9) + "px";
    box.textContent = rows.map(function (r) { return r[0] + ": " + r[1]; }).join("\n");
    document.body.appendChild(box);
  }
  // 导航 tab 是 boot.js 稍后才渲染的（DOMContentLoaded/load 时还是空的），
  // 所以除了这两个事件，再补几个延时重绘，保证真机截图时那一行有数。
  window.addEventListener("DOMContentLoaded", render);
  window.addEventListener("load", render);
  [300, 1000, 2500, 4000].forEach(function (ms) { setTimeout(render, ms); });
})();
</script>
    <title>MAA Web Control</title>
    <link rel="icon" href="newlogo.ico" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />

    <link rel="stylesheet" href="styles/settings.css" />
  </head>
  <body>
    <div class="windowShell">
      <header class="titlebar">
        <div class="windowTitle">
          <img class="appIcon" src="newlogo.ico" alt="" />
          <span id="windowTitleText">MAA Web</span>
        </div>
        <div class="windowTools">
          <button id="refreshButton" type="button" title="刷新全部数据">⟳</button>
          <button type="button" title="在新窗口打开（独立网页）" onclick="window.open(location.href, '_blank')">⧉</button>
          <span class="windowDecor" aria-hidden="true">─</span>
          <span class="windowDecor" aria-hidden="true">□</span>
          <span class="windowDecor" aria-hidden="true">×</span>
        </div>
      </header>

      <nav class="mainNav" role="tablist" aria-label="主导航"></nav>

      <main class="content">
        <section id="view-basement" class="view active">
          <div class="maaLayout">
            <aside class="taskColumn">
              <div class="taskBox">
                <div id="taskList" class="taskList"></div>
                <div class="taskButtons">
                  <button id="addTaskButton" type="button">＋</button>
                  <button id="moveUpButton" type="button">全选</button>
                  <button id="deleteTaskButton" type="button">清空</button>
                </div>
              </div>
              <div class="afterRun">
                <span>完成后</span>
                <strong>无动作</strong>
              </div>
              <button id="runButton" type="button" class="linkStart">Link Start!</button>
                </aside>

            <section class="settingsArea">
              <div id="taskEditor" class="taskEditor empty">请选择一个任务</div>
              <div class="modeTabs">
                <button class="active" type="button" data-setting-mode="general">常规设置</button>
                <button type="button" data-setting-mode="advanced">高级设置</button>
              </div>
              <div class="tipsBlock" id="stageTipsBlock"></div>
            </section>

            <aside class="eventColumn" aria-label="事件日志">
              <div class="miniStatus">
                <div><span>状态</span><strong id="runnerState">Idle</strong></div>
                <div><span>任务</span><strong id="taskProgress">0 / 0</strong></div>
                <div><span>ADB</span><strong id="adbStatus">未配置</strong></div>
              </div>
              <div class="eventPanel">
                <div class="panelHead">
                  <span>执行日志</span>
                  <button id="clearLogsButton" type="button">清空</button>
                </div>
                <div id="logList" class="logList" data-log-list="main" aria-live="polite" aria-relevant="additions"></div>
              </div>
              <div class="eventPanel rawLogPanel">
                <div class="panelHead">
                  <span>运行日志</span>
                  <button id="rawLogToggle" type="button" class="rawLogToggleBtn" data-log-raw-toggle>展开</button>
                </div>
                <div id="rawLogList" class="logList rawLogList" data-log-list="raw" hidden></div>
              </div>
            </aside>
          </div>
        </section>

        <section id="view-copilot" class="view">
          <div id="copilotLayout" class="copilotLayout">
            <div id="copilotViewRoot" class="copilotViewRoot"></div>
            <aside class="eventColumn copilotLogColumn" aria-label="自动战斗日志">
              <div class="eventPanel">
                <div class="panelHead">
                  <span>执行日志</span>
                  <button id="copilotClearLogsButton" type="button" data-copilot-log-action="clear">清空</button>
                </div>
                <div id="copilotLogList" class="logList" data-log-list="main" aria-live="polite" aria-relevant="additions"></div>
              </div>
              <div class="eventPanel rawLogPanel">
                <div class="panelHead">
                  <span>运行日志</span>
                  <button id="copilotRawLogToggle" type="button" class="rawLogToggleBtn" data-log-raw-toggle data-copilot-log-action="toggle-raw">展开</button>
                </div>
                <div id="copilotRawLogList" class="logList rawLogList" data-log-list="raw" hidden></div>
              </div>
            </aside>
          </div>
        </section>

        <section id="view-tools" class="view">
          <div class="toolsLayout">
            <div id="toolsViewRoot" class="toolsViewRoot"></div>
            <aside class="eventColumn toolsLogColumn" aria-label="小工具日志">
              <div class="eventPanel">
                <div class="panelHead">
                  <span>执行日志</span>
                  <button id="toolsClearLogsButton" type="button">清空</button>
                </div>
                <div id="toolsLogList" class="logList" data-log-list="main" aria-live="polite" aria-relevant="additions"></div>
              </div>
            </aside>
          </div>
        </section>

        <section id="view-settings" class="view">
          <div id="settingsViewRoot" class="settingsViewRoot"></div>
        </section>
      </main>
    </div>

    <script src="views/settings/scroll.js"></script>
    <script src="views/settings/scheduler.js"></script>
    <script src="views/settings/events.js"></script>
    <script src="views/settings/sections/config.js"></script>
    <script src="views/settings/sections/timer.js"></script>
    <script src="views/settings/sections/game.js"></script>
    <script src="views/settings/sections/performance.js"></script>
    <script src="views/settings/sections/connection.js"></script>
    <script src="views/settings/sections/maacore.js"></script>
    <script src="views/settings/sections/startup.js"></script>
    <script src="views/settings/sections/ui.js"></script>
    <script src="views/settings/sections/background.js"></script>
    <script src="views/settings/sections/remote.js"></script>
    <script src="views/settings/sections/notification.js"></script>
